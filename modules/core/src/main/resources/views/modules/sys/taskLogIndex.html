                    <th>
                        执行人

                    <th>

<script type="text/javascript">

    $(document).ready(function() {
        console.log('ready');
        initData();
    });

    /**
     * 初始化数据
     */
    function initData() {
        const url = window.location.origin + '/a/sys/task/logList';
        $.get(url, function(logList) {
            for(const index in logList) {
                const line = logList[index];
                let classStr = index%2==0?'class="success"':'class="info"';
                let html = '<tr '+classStr+'>\n' +
                    '<td>'+ line.runTaskMan + '</td>' +
                    '<td>'+ line.batchNo + '</td>' +
                    '<td>'+ line.startTime + '</td>' +
                    '<td>'+ line.runRemark + '</td>' +
                    '<td><button class="btn btn-mini btn-info" type="button" onclick="look(\''+line.id+'\')">查看</button></td>' +
                    '</tr>';
                $('#logList tr:last').after(html);
            }
        })
    }

    function look(logId) {
        // 显示详情
        $('#itemListDiv').attr('style', 'display:block;')

        // 清空tr
        const bodyListDom = $("#bodyList");
        // bodyListDom.html('');
        // console.log(bodyListDom);
        // bodyListDom.html('<tbody id="bodyList"><tbody>');
        bodyListDom.html('');

        const url = window.location.origin + '/a/sys/task/taskDetail?logId='+logId;
        $.get(url, function(taskDetailMap, status) {
            // console.log("reDate: " + reDate + "status: " + status);

            // 设置值
            $("#runTaskMan").val(taskDetailMap.runTaskMan);
            $("#batchNo").val(taskDetailMap.batchNo);
            $("#runRemark").val(taskDetailMap.runRemark);
            $("#startTime").val(taskDetailMap.startTime);
            // $("#infoLine1").html(
            //     '执行人: ' + taskDetailMap.runTaskMan + '。 '
            //     + '\t\t\t执行批次号: ' + taskDetailMap.batchNo + '。 '
            //     + '\t\t\t执行备注: ' + taskDetailMap.runRemark + '。'
            // );
            // $("#infoLine2").html(
            //     '开始执行时间: ' + taskDetailMap.startTime
            // );

            const taskMap = taskDetailMap.taskMap;
            const taskRunItemList = taskDetailMap.taskRunItemList;
            let htmlAll = '';
            for(const index in taskRunItemList) {
                const line = taskRunItemList[index];
                let classStr = index%2==0?'class="success"':'class="info"';
                let html = '<tr '+classStr+'>\n' +
                    '<td>'+ line.taskNum + '</td>' +
                    '<td>'+ taskMap[line.taskNum].taskName +'</td>' +
                    '<td>'+ taskMap[line.taskNum].scriptName +'</td>' +
                    '<td>'+ taskMap[line.taskNum].taskDesc +'</td>' +
                    '<td>'+ line.taskStatusStr + '</td>' +
                    '<td>'+ (line.startTime == undefined ? '暂无' : line.startTime) + '</td>' +
                    '<td>'+ (line.endTime == undefined ? '暂无' : line.endTime) + '</td>' +
                    '<td>'+ line.inputPath + '</td>' +
                    '<td>'+ line.outputPath + '</td>' +
                    '</tr>';
                htmlAll += html;
                // $('#logList tr:last').after(html);
                // bodyListDom.html('<tbody id="bodyList">'+html+'<tbody>');
            }
            bodyListDom.html(htmlAll);
        });

        // let html = '<tr>\n' +
        //     '<td>111</td>' +
        //     '<td>'+logId+'</td>' +
        //     '</tr>';
        // // $('#runTaskList tr:last').after(html);
        // bodyListDom.html(html);
    }

</script>
